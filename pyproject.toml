[project]
name = "karaoke"
version = "0.4.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "qrcode>=7.4",
  "numpy>=1.26",
  "websockets>=17.1",
  "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
